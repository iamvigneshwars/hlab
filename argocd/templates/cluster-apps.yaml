apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cluster
  source:
    repoURL: 'https://github.com/iamvigneshwars/hlab'
    path: cluster
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
