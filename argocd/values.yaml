argo-cd:
  configs:
    cm:
      url: http://argocd.lan
      oidc.config: |
        name: Keycloak
        issuer: http://keycloak.lan/realms/homelab
        clientID: argocd
        clientSecret: cRUTsyCNgZMz1tYVDUpIKAQdMIKuTuzA
        usernameClaim: email
        requestedScopes:
          - openid
          - email
          - profile
    rbac:
      create: true
      policy.default: role:readonly
      scopes: "[email]"
      policy.csv: |
        p, role:admin, applications, *, */*, allow
        p, role:admin, clusters, *, *, allow
        p, role:admin, repositories, *, *, allow
        p, role:admin, projects, *, *, allow
        p, role:admin, exec, create, */*, allow
        p, role:admin, logs, get, */*, allow
        p, role:admin, settings, *, *, allow
        g, admin, role:admin
        g, viki@admin.com, role:admin

  redis-ha:
    enabled: false
  redis:
    nodeSelector:
      kubernetes.io/hostname: rpi1
    # resources:
    #   limits:
    #     cpu: 100m
    #     memory: 128Mi
    #   requests:
    #     cpu: 50m
    #     memory: 64Mi

  controller:
    nodeSelector:
      kubernetes.io/hostname: rpi1
    replicas: 1
    # resources:
    #   limits:
    #     cpu: 300m
    #     memory: 512Mi
    #   requests:
    #     cpu: 100m
    #     memory: 256Mi

  server:
    nodeSelector:
      kubernetes.io/hostname: rpi1
    replicas: 1
    autoscaling:
      enabled: false
    # resources:
    #   limits:
    #     cpu: 200m
    #     memory: 256Mi
    #   requests:
    #     cpu: 50m
    #     memory: 128Mi

  repoServer:
    nodeSelector:
      kubernetes.io/hostname: rpi1
    replicas: 1
    # resources:
    #   limits:
    #     cpu: 200m
    #     memory: 1Gi
    #   requests:
    #     cpu: 50m
    #     memory: 512Mi

  applicationSet:
    nodeSelector:
      kubernetes.io/hostname: rpi1
    # resources:
    #   limits:
    #     cpu: 100m
    #     memory: 128Mi
    #   requests:
    #     cpu: 50m
    #     memory: 64Mi

  notifications:
    enabled: false
  dex:
    enabled: false
  crds:
    install: true

  server:
    insecure: true
    ingress:
      enabled: true
      hostname: argocd.lan
      path: /
      pathType: Prefix
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    extraArgs:
      - --insecure
