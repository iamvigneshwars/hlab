apiVersion: v1
kind: PersistentVolume
metadata:
  name: adguard-home
  labels:
    app: adguard-home
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-data
  nfs:
    server: 192.168.1.252
    path: "/srv/nfs/data/k8s/adguard"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-home
  labels:
    app: adguard-home
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-data
  volumeName: adguard-home
  resources:
    requests:
      storage: 10Gi
