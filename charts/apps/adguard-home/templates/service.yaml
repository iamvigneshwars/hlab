apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  labels:
    app: adguard-home
spec:
  type: {{ .Values.service.type }}
  selector:
    app: adguard-home
  ports:
    - name: setup
      port: {{ .Values.service.setupPort }}
      targetPort: setup
      protocol: TCP
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
    - name: dns-tcp
      port: {{ .Values.service.dnsPort }}
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: {{ .Values.service.dnsPort }}
      targetPort: dns-udp
      protocol: UDP
