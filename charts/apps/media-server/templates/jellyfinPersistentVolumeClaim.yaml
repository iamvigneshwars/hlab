{{- if .Values.jellyfin.enabled }}
apiVersion: v1
kind: PersistentVolume 
metadata:
  name: jellyfin-config
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain 
  storageClassName: nfs-data
  nfs:
    server: 192.168.1.252
    path: "/srv/nfs/data/k8s/jellyfin"
  # local:
  #   path: /srv/data/k8s/jellyfin
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/hostname
  #           operator: In
  #           values:
  #             - rpi2
  #
---

apiVersion: v1
kind: PersistentVolume 
metadata:
  name: media
spec:
  capacity:
    storage: 10Gi 
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain 
  storageClassName: nfs-data
  nfs:
    server: 192.168.1.252
    path: "/srv/nfs/data"
  # local:
  #   path: /srv/data
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/hostname
  #           operator: In
  #           values:
  #             - rpi2

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-data
  volumeName: jellyfin-config
  resources:
    requests:
      storage: 1Gi

--- 

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-data
  volumeName: media
  resources:
    requests:
      storage: 10Gi
{{- end }}
