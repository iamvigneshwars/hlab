transmission:
  # Allow slow startup and brief NFS/HTTP stalls without a restart loop.
  startupProbe:
    httpGet:
      path: /transmission/web/
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  livenessProbe:
    httpTimeoutSeconds: 15
    timeoutSeconds: 20
    periodSeconds: 20
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 10
  resources: { limits: { cpu: "750m", memory: "512Mi" } }
  persistence:
    config:
      existingClaim: transmission-config
    downloads:
      type: pvc
      existingClaim: transmission-downloads
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: transmission.visar.cloud
        paths:
          - path: /
            pathType: Prefix
    tls: []

jellyfin:
  enabled: false
  resources: {}
    # requests:
    #   cpu: "2000m"
    #   memory: "2000Mi"
    # limits:
    #   cpu: "3500m"
    #   memory: "3000Mi"
plex:
  hostNetwork: true
  image: linuxserver/plex:1.43.2
  dnsPolicy: ClusterFirstWithHostNet
  resources: {}
