postgresql:
  auth:
    existingSecret: "postgres-auth"
  primary:
    nodeSelector:
      database: "true"
    persistence:
      enabled: true
      existingClaim: "postgres"
      mountPath: /bitnami/postgresql
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    service:
      type: LoadBalancer
  volumePermissions:
    enabled: true

pgadmin4:
  env:
    email: "admin@admin.com"
    password: "admin"
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: pgadmin.visar.cloud
        paths:
          - path: /
            pathType: Prefix
  nodeSelector:
    database: "true"
  persistentVolume:
    enabled: true
    existingClaim: "pgadmin"
  volumePermissions:
    enabled: true
