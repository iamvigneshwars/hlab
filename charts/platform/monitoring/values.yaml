kube-prometheus-stack:
  alertmanager:
    enabled: false

  grafana:
    enabled: true
    initChownData:
      enabled: false
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - grafana.visar.cloud
      path: /
      pathType: Prefix
      tls:
        - hosts:
            - grafana.visar.cloud
    envFromSecret: grafana-oidc
    grafana.ini:
      server:
        root_url: https://grafana.visar.cloud
      auth:
        oauth_auto_login: true
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        allow_sign_up: true
        client_id: grafana-oauth
        client_secret: $__env{CLIENT_SECRET}
        scopes: openid profile email
        auth_url: https://keycloak.visar.cloud/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.visar.cloud/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.visar.cloud/realms/homelab/protocol/openid-connect/userinfo
        login_attribute_path: preferred_username
        email_attribute_path: email
        name_attribute_path: full_name
        use_refresh_token: true
        role_attribute_path: contains() && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      storageClassName: nfs-grafana
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    # Bootstrap-only default
    adminPassword: admin
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - rpi1

  prometheus:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - prometheus.visar.cloud
      path: /
      pathType: Prefix
      tls:
        - hosts:
            - prometheus.visar.cloud
    prometheusSpec:
      externalUrl: https://prometheus.visar.cloud
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: nfs-prometheus
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # resources:
      #   requests:
      #     cpu: 200m
      #     memory: 400Mi
      #   limits:
      #     cpu: 500m
      #     memory: 1Gi
      retention: 3d
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rpi1

  kube-state-metrics:
    enabled: true
    # resources:
    #   requests:
    #     cpu: 50m
    #     memory: 250Mi
    #   limits:
    #     cpu: 100m
    #     memory: 500Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - rpi1

  prometheusOperator:
    enabled: true
    # resources:
    #   requests:
    #     cpu: 100m
    #     memory: 100Mi
    #   limits:
    #     cpu: 200m
    #     memory: 200Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - rpi1

  prometheus-node-exporter:
    enabled: true
    prometheus:
      monitor:
        attachMetadata:
          node: true
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node
        metricRelabelings: []
    # resources:
    #   requests:
    #     cpu: 50m
    #     memory: 100Mi
    #   limits:
    #     cpu: 100m
    #     memory: 200Mi
