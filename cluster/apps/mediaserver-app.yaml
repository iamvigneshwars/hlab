apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediaserver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mediaserver
  source:
    repoURL: 'https://github.com/iamvigneshwars/hlab'
    path: mediaserver
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

