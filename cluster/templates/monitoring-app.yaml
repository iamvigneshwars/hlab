apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  source:
    repoURL: 'https://github.com/iamvigneshwars/hlab'
    path: monitoring
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        {{- if .Values.monitoring.extraValueFiles }}
        {{- .Values.monitoring.extraValueFiles | toYaml | nindent 8 }}
        {{- end }}
      {{- if .Values.monitoring.valuesObject }}
      valuesObject:
        {{- .Values.monitoring.valuesObject | toYaml | nindent 8 }}
      {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
