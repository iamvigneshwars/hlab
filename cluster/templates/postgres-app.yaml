apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: postgres
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: postgres
  source:
    repoURL: 'https://github.com/iamvigneshwars/hlab'
    path: postgres
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        {{- if .Values.postgres.extraValueFiles }}
        {{- .Values.postgres.extraValueFiles | toYaml | nindent 8 }}
        {{- end }}
      {{- if .Values.postgres.valuesObject }}
      valuesObject:
        {{- .Values.postgres.valuesObject | toYaml | nindent 8 }}
      {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
