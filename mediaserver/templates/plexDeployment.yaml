apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  labels:
    app: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: mediaserver
                    operator: In
                    values:
                      - "true"
      tolerations:
        - key: "mediaserver"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: plex
          image: linuxserver/plex:1.42.2
          ports:
            - containerPort: 32400
          env:
            - name: TZ
              value: "Europe/London"
            - name: PLEX_CLAIM
              value: ""
          volumeMounts:
            - name: media
              mountPath: /media
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.plex.resources | nindent 12 }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
