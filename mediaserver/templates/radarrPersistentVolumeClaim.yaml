apiVersion: v1
kind: PersistentVolume 
metadata:
  name: radarr-config
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /srv/data/k8s/radarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - rpi2

--- 

apiVersion: v1
kind: PersistentVolumeClaim 
metadata:
  name: radarr-config
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: local-storage
  volumeName: radarr-config
  resources:
    requests:
      storage: 5Gi
