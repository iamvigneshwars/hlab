apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 2Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nfs:
    path: /mnt/nvmestore/kube-configs
    server: 192.168.1.2
    readOnly: false

--- 

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: prometheus
  resources:
    requests:
      storage: 2Gi
