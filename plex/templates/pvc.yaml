apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /srv/data/k8s/plex-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - rpi2

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: local-storage
  volumeName: plex
  resources:
    requests:
      storage: 20Gi
